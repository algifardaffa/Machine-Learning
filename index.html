<style>

.fsl::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--i300);border:2px solid var(--i50);box-shadow:0 0 0 2px var(--i700);cursor:grab}

.btn{width:100%;background:var(--i600);color:#fff;font:600 1rem Inter,sans-serif;padding:.75rem 1rem;border:0;border-radius:.75rem;cursor:pointer}.btn:hover{background:var(--i500)}

.dt{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.4rem}.ok{color:#4ade80}.no{color:#f87171}

@media(max-width:640px){.pn{padding:1rem}.rt thead{display:none}.rt,.rt tbody,.rt tr,.rt td{display:block}.rt tr{border:1px solid rgba(51,65,85,.6);border-radius:.75rem;padding:.25rem .75rem;margin-bottom:.5rem}.rt td{display:flex;justify-content:space-between;gap:.75rem;border:0;padding:.25rem 0;text-align:right}.rt td::before{content:attr(data-l);color:var(--s400);font-size:.75rem;text-align:left}}
@media(max-width:380px){.fnum{width:3.2rem}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap"><header class="hd"><div class="br">
<img src="icon-192.png" alt="THE ML 101 logo" width="44" height="44">
<div style="min-width:0"><div class="bt">THE ML 101</div><div class="bs">Four Algorithms. Four Perspectives.</div></div></div>
<div class="ha"><button id="mt" class="hb" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mp"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<div id="mp" class="mp" hidden></div></div></header>
<main id="main"></main></div>
<script>
const ORIG=[["A",1,5,45,0],["B",2,6,50,0],["C",2,7,55,0],["D",3,6,60,0],["E",4,7,65,1],["F",5,7,72,1],["G",6,8,78,1],["H",7,7,85,1],["I",8,8,90,1],["J",9,8,95,1]];
const $=s=>document.querySelector(s),F=(x,d=1)=>Number.isFinite(x)?x.toFixed(d):'–';
const mk=()=>ORIG.map(r=>({id:r[0],s:r[1],z:r[2],e:r[3],p:r[4]}));
const FLD={lr:['s','z','e'],lg:['s','z','p'],km:['s','z','e'],pc:['s','z','e']},FD={s:['Study Hours',0,12,.5,'h'],z:['Sleep Hours',0,12,.5,'h'],e:['Exam Score',0,100,1,'']};
const P={},V={'lr.s':6,'lr.z':8,'lg.s':6,'lg.z':8,'lg.th':.5},TF={'lr.s':1,'lr.z':1},SUM={};let K=3,ACT='lr';
['lr','lg','km','pc'].forEach(k=>P[k]={rows:mk(),sel:0});
const PG={
lr:{t:'Linear Regression',c:'#3B82F6',ic:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',sub:'Predict a number: the exam score.',qa:['What question?|What exam score can we expect for a student?','What data?|Study Hours and Sleep Hours → Exam Score.','What does it mean?|The model fits the best line. Each coefficient is the score change per extra hour.']},
lg:{t:'Logistic Regression',c:'#16A34A',ic:'<path d="M3 18h5c5 0 4-12 9-12h4"/>',sub:'Predict a category: pass or fail.',qa:['What question?|Will this student pass or fail?','What data?|Study Hours and Sleep Hours → Passed (0 or 1).','What does it mean?|A probability from 0% to 100%. At or above the threshold, the class is Passed.']},
km:{t:'K-Means Clustering',c:'#D97706',ic:'<circle cx="7" cy="8" r="3"/><circle cx="17" cy="9" r="3"/><circle cx="12" cy="18" r="3"/>',sub:'Find groups without labels.',qa:['What question?|Are there natural groups of students?','What data?|Study Hours, Sleep Hours, Exam Score (standardized). Passed is not used.','What does it mean?|Similar rows share a cluster. The algorithm does not know what a cluster means; the notes only restate averages.']},
pc:{t:'Principal Component Analysis',c:'#9333EA',ic:'<path d="M4 20V4M4 20h16M7 16l10-8"/>',sub:'Simplify 3 variables into 2 components.',qa:['What question?|Can three variables be summarized by two?','What data?|Study Hours, Sleep Hours, Exam Score (standardized).','What does it mean?|PC1 and PC2 are new axes. Explained variance is how much information each keeps.']}};
const RT={
lr:'<div class="fcr ftr keep"><span class="tl">Use Study Hours</span><label class="tg"><input type="checkbox" data-t="f.lr.s" checked><i></i></label></div><div class="fcr ftr keep"><span class="tl">Use Sleep Hours</span><label class="tg"><input type="checkbox" data-t="f.lr.z" checked><i></i></label></div><div class="fl" id="lr-rh"></div><div class="cv"><canvas id="lr-r"></canvas></div><p class="note" id="lr-rn"></p><div class="fl">Actual vs predicted per student</div><div class="cv"><canvas id="lr-c"></canvas></div><hr><div class="g3 c2" id="lr-st"></div><div class="fl">New student</div><div id="lr-in"></div><p class="note" id="lr-eq"></p><div class="tw" id="lr-tab"></div>',
lg:'<div class="fl">Actual vs predicted</div><div class="tw" id="lg-tab"></div><hr><div class="g3 c2" id="lg-st"></div><div class="fl">New student</div><div id="lg-in"></div><div id="lg-out"></div>',
km:'<div class="fl">Number of clusters (K)</div><div class="chips" id="km-k"></div><div class="cv"><canvas id="km-c"></canvas></div><div class="fl">Elbow method</div><div class="cv"><canvas id="km-e"></canvas></div><p class="note" id="km-el"></p><div class="fl">Cluster summary</div><div class="tw" id="km-sum"></div><div class="fl">Assignments</div><div class="tw" id="km-tab"></div>',
pc:'<div class="fl">Before: original features</div><div class="cv"><canvas id="pc-b"></canvas></div><div class="fl">After: PC1 vs PC2</div><div class="cv"><canvas id="pc-a"></canvas></div><p class="note" id="pc-cmp"></p><div class="tw" id="pc-tab"></div>'};
const ICO=s=>'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+s+'</svg>';
/* build pages + menu */
const main=$('#main');let menu='';
Object.keys(PG).forEach(k=>{const g=PG[k];menu+='<button class="mi" data-go="'+k+'" type="button"><span style="color:'+g.c+'">'+ICO(g.ic)+'</span>'+g.t+'</button>';
main.insertAdjacentHTML('beforeend','<section class="tab-section" id="s-'+k+'"><div class="pn"><div class="tt"><span style="color:'+g.c+'">'+ICO(g.ic)+'</span><div><h2>'+g.t+'</h2><p class="help">'+g.sub+' This page has its own dataset.</p></div></div><div class="alert" id="'+k+'-msg" hidden></div>'+(k=='km'||k=='pc'?'<div class="g3 c2" id="'+k+'-st"></div><hr>':'')+'<div class="g2"><div class="ctl" id="'+k+'-ds"></div><div class="res" id="'+k+'-rt">'+RT[k]+'</div></div></div></section>')});
menu+='<div class="md"></div><button class="mi" id="ia" type="button"><span style="color:#818cf8">'+ICO('<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>')+'</span><b id="il" style="font-weight:600">Download app</b></button><p class="ih" id="ih" hidden></p>';$('#mp').innerHTML=menu;
main.insertAdjacentHTML('beforeend','<section class="tab-section" id="s-cmp"><div class="pn"><div class="tt"><span style="color:#1d4ed8">'+ICO('<rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/>')+'</span><div><h2>Compare</h2><p class="help">Four algorithms, four questions. Each result comes from that page’s own dataset, so edit a page to change its card.</p></div></div><div class="cmp" id="cmp-c"></div><hr><div class="tw" id="cmp-t"></div></div></section>');
/* helpers */
const T=(h,R)=>'<table class="rt"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+R.map(r=>'<tr>'+r.map((c,i)=>'<td data-l="'+h[i]+'">'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const ch=a=>a.map(x=>'<div class="c2"><span class="cl">'+x[0]+'</span><span class="cv2">'+x[1]+'</span><span class="cs">'+x[2]+'</span></div>').join('');
const dt=c=>'<span class="dt" style="background:'+c+'"></span>';
function sr(key,lab,mn,mx,st,v,u){return '<div class="fcr" data-k="'+key+'" data-min="'+mn+'" data-max="'+mx+'" data-st="'+st+'"><div class="fh"><label>'+lab+'</label><div class="fst"><button type="button" class="fsb" data-d="-1" aria-label="Decrease '+lab+'">−</button><input class="fnum" type="number" inputmode="decimal" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+v+'" aria-label="'+lab+'"><button type="button" class="fsb" data-d="1" aria-label="Increase '+lab+'">+</button>'+(u?'<span class="fu">'+u+'</span>':'')+'</div></div><input class="fsl" type="range" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+v+'" style="--p:'+(v-mn)/(mx-mn)+'" aria-label="'+lab+'"><div class="fmm"><span>'+mn+u+'</span><span>'+mx+u+'</span></div></div>'}
$('#lr-in').innerHTML=sr('i.lr.s','Study Hours',0,12,.5,6,'h')+sr('i.lr.z','Sleep Hours',0,12,.5,8,'h');
$('#lg-in').innerHTML=sr('i.lg.s','Study Hours',0,12,.5,6,'h')+sr('i.lg.z','Sleep Hours',0,12,.5,8,'h')+sr('i.lg.th','Pass threshold',.05,.95,.05,.5,'');
function ds(k){const p=P[k],r=p.rows[p.sel];$('#'+k+'-ds').innerHTML='<div class="fl">Dataset · '+p.rows.length+' students</div><div class="chips">'+p.rows.map((x,i)=>'<button type="button" class="tb'+(i==p.sel?' active':'')+'" data-sel="'+i+'">'+x.id+'</button>').join('')+'</div>'+
(r?FLD[k].map(f=>f=='p'?'<div class="fcr ftr"><span class="tl">Passed?</span><label class="tg"><input type="checkbox" data-t="d.'+k+'.p"'+(r.p?' checked':'')+'><i></i></label></div>':sr('d.'+k+'.'+f,FD[f][0],FD[f][1],FD[f][2],FD[f][3],r[f],FD[f][4])).join(''):'<p class="note">The dataset is empty. Add a student.</p>')+
'<div class="fa"><button type="button" class="fsec" data-a="add">Add student</button><button type="button" class="fsec" data-a="del">Delete</button><button type="button" class="fsec" data-a="rst">Reset</button></div><p class="note">Moving a slider changes student '+(r?r.id:'–')+' on this page only.</p>'}
function setv(r,v){v=parseFloat(v);if(!Number.isFinite(v))return;const mn=+r.dataset.min,mx=+r.dataset.max,st=+r.dataset.st;v=+Math.min(mx,Math.max(mn,Math.round(v/st)*st)).toFixed(2);const n=r.querySelector('.fnum'),s=r.querySelector('.fsl');if(document.activeElement!==n)n.value=v;s.value=v;s.style.setProperty('--p',(v-mn)/(mx-mn));
const[t,p,f]=r.dataset.k.split('.');if(t=='d'){const w=P[p].rows[P[p].sel];if(w)w[f]=v}else V[p+'.'+f]=v;run(p)}
document.addEventListener('input',e=>{const r=e.target.closest('.fcr[data-k]');if(r&&e.target.type!='checkbox')setv(r,e.target.value)});
document.addEventListener('change',e=>{const t=e.target.dataset.t;if(!t)return;const[a,p,f]=t.split('.');if(a=='f')TF[p+'.'+f]=e.target.checked?1:0;else{const w=P[p].rows[P[p].sel];if(w)w.p=e.target.checked?1:0}run(p)});
document.addEventListener('click',e=>{const b=e.target,q=s=>b.closest(s);
if(q('.fsb')){const r=q('.fcr');setv(r,+r.querySelector('.fnum').value+ +q('.fsb').dataset.d*+r.dataset.st);return}

function logi(d){if(d.length<4)return'Need at least 4 students.';const n1=d.filter(r=>r.p).length;if(!n1||n1==d.length)return'Both Failed (0) and Passed (1) students are needed to train.';
