function restoreMemory(){try{const raw=localStorage.getItem(MEMORY_KEY);if(!raw)return false;const data=JSON.parse(raw);if(!data||data.version!==1)return false;for(const k of Object.keys(P)){const x=data.pages&&data.pages[k];if(x&&Array.isArray(x.rows)){P[k].rows=x.rows.filter(r=>r&&typeof r.id==='string'&&['s','z','e','p'].every(f=>Number.isFinite(+r[f]))).map(r=>({id:r.id.slice(0,12),s:+r.s,z:+r.z,e:+r.e,p:r.p?1:0}));P[k].sel=Math.max(0,Math.min(Math.max(0,P[k].rows.length-1),Number(x.sel)||0))}}if(data.values)Object.keys(V).forEach(k=>{if(Number.isFinite(+data.values[k]))V[k]=+data.values[k]});if(data.toggles)Object.keys(TF).forEach(k=>{if(data.toggles[k]===0||data.toggles[k]===1)TF[k]=data.toggles[k]});if(Number.isFinite(+data.k))K=Math.max(2,Math.min(6,+data.k));if(['lr','lg','km','pc','cmp'].includes(data.active))ACT=data.active;return true}catch(e){console.warn('Browser memory could not be restored:',e);return false}}

V['km.auto']=V['km.auto']?1:0;['lr.m','km.m','pc.m','lg.m'].forEach(k=>{if(![0,1,2].includes(V[k]))V[k]=1});TF['lr.s']=V['lr.m']!=2?1:0;TF['lr.z']=V['lr.m']!=0?1:0;
const PG={
lr:{t:'Linear Regression',c:'#3B82F6',ic:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',sub:'Predict a number: the exam score.',qa:['What question?|What exam score can we expect for a student?','What data?|Study Hours and Sleep Hours → Exam Score.','What does it mean?|The model fits the best line. Each coefficient is the score change per extra hour.']},
lg:{t:'Logistic Regression',c:'#16A34A',ic:'<path d="M3 18h5c5 0 4-12 9-12h4"/>',sub:'Predict a category: pass or fail.',qa:['What question?|Will this student pass or fail?','What data?|Study Hours and Sleep Hours → Passed (0 or 1).','What does it mean?|A probability from 0% to 100%. At or above the threshold, the class is Passed.']},
